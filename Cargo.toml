[package]
name = "rust-dds"
version = "0.16.0"
edition = "2021"
description = "rust-DDS: Rust library for DDS (Data Distribution Service) publish/subscribe — RELAY conformant."
license = "MPL-2.0"
repository = "https://github.com/SoundMatt/rust-DDS"
homepage = "https://github.com/SoundMatt/rust-DDS"
keywords = ["dds", "pubsub", "automotive", "embedded", "relay"]
categories = ["embedded", "network-programming", "asynchronous"]
rust-version = "1.85"

[lib]
name = "rust_dds"
path = "src/lib.rs"

[[bin]]
name = "rust-dds"
path = "src/bin/main.rs"

# Test/dev support tool for the "live two-process test harness" interop
# deliverable (ROADMAP.md, "Interop testing" section) — not part of the
# public library API. See src/bin/rtps_interop_peer.rs's module docs.
[[bin]]
name = "rtps-interop-peer"
path = "src/bin/rtps_interop_peer.rs"

[features]
# Gates `tests/cyclone_interop.rs` — RTPS wire-compatibility tests against a
# live, independent CycloneDDS peer (ROADMAP.md "Interop testing",
# deliverable 3 of 3). The Rust equivalent of go-DDS's `interop` Go build
# tag: without this feature the test file does not even compile, so it
# never runs in the normal `cargo test` sweep or default CI, matching the
# non-intrusive posture of this crate's own `#[ignore]`d
# `rtps_two_process_interop` test. See `docker-compose.yml` and the module
# doc comment at the top of `tests/cyclone_interop.rs` for how to run it.
cyclone-interop = []

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
base64 = "0.22"
socket2 = "0.6"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
