name: CI

on:
  push:
    branches: [main, feat/init-project]
  pull_request:
    branches: [main, feat/init-project]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }} / Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.85", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  release-build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --all-features

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  security-audit:
    name: security audit — cargo audit + cargo deny (REQ-SEC-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies for known CVEs
        run: cargo audit
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Deny policy — licenses and advisories
        run: cargo deny check advisories licenses sources

  coverage:
    name: structural coverage — cargo tarpaulin (REQ-DO-013)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Measure statement + branch coverage
        run: cargo tarpaulin --out Xml --output-dir coverage/ --engine llvm
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/cobertura.xml

  relay-conform:
    name: RELAY §12 conformance — relay conform --strict (REQ-RELAY-004, §20.1.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build RELAY CLI
        run: |
          git clone https://github.com/SoundMatt/RELAY /tmp/relay-src
          cd /tmp/relay-src && go build -o /tmp/relay ./cmd/relay/
      - name: Build rust-dds release binary
        run: cargo build --release
      - name: Validate §12.1/§12.2/§12.3 JSON schemas
        run: /tmp/relay conform --strict ./target/release/rust-dds

  relay-interop:
    name: RELAY behavioural conformance — relay interop --strict (§20.1.3, §20.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build RELAY CLI
        run: |
          git clone https://github.com/SoundMatt/RELAY /tmp/relay-src
          cd /tmp/relay-src && go build -o /tmp/relay ./cmd/relay/
      - name: Build rust-dds release binary
        run: cargo build --release
      # --protocol DDS: rust-dds's `convert` only adapts DDS (§20.2 "for
      # each vector of its protocol"); the full unrestricted vector set spans
      # every x-Net protocol (CAN, LIN, MQTT, RCP, SOMEIP too), which a
      # DDS-only implementation cannot and is not expected to convert.
      # --strict: now that `convert` is implemented and advertised, a real
      # conversion failure MUST fail this job rather than ever again being
      # masked as a non-strict SKIP.
      - name: Run behavioural conformance (real convert, no SKIP masking)
        run: /tmp/relay interop --protocol DDS --strict ./target/release/rust-dds

  rtps-interop:
    name: RTPS wire-level interop (ROADMAP.md "Interop testing")
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Deliverable 1/3: live two-process test harness — two real
      # `rtps-interop-peer` OS processes on real UDP loopback/multicast,
      # asserting SPDP discovery, SEDP matching, and end-to-end sample
      # delivery, including a reliable-QoS run that forces and recovers a
      # real dropped datagram between the two processes. `#[ignore]`d in
      # the default `cargo test` sweep (real process spawning + real UDP
      # multicast is unsuited to the cross-platform test matrix), so it
      # only runs here — analogous to but distinct from the `relay-interop`
      # job above (that job checks RELAY-adapter JSON equivalence, never
      # puts a packet on a wire; this job does).
      - name: Live two-process RTPS interop (SPDP + SEDP + reliable retransmission)
        run: cargo test --release --test rtps_two_process_interop -- --ignored --test-threads=1
      # Deliverable 2/3: pcap-fixture conformance — recorded known-good
      # go-DDS RTPS traffic decoded and checked byte-for-byte against
      # RTPS 2.3 §9 framing. Not `#[ignore]`d (no live peer, no network,
      # deterministic) so it already runs in the default `test` job too;
      # re-run here so a full green `rtps-interop` job is one place to
      # look for "is RTPS interop OK".
      - name: pcap-fixture conformance (byte-exact go-DDS reference decode)
        run: cargo test --test rtps_pcap_conformance

  shmem-interop:
    name: shmem transport two-process interop (ROADMAP.md "Planned — v0.4")
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two real `shmem-interop-peer` OS processes exchanging samples over
      # a real per-topic rendezvous file (no shared in-process state), plus
      # a late-joining reader started only after the writer process has
      # already exited, proving `shmem::ShmemParticipant`'s cross-process
      # TransientLocal fallback works with no writer process alive at all.
      # `#[ignore]`d in the default `cargo test` sweep (real process
      # spawning is unsuited to the cross-platform test matrix), so it
      # only runs here — analogous to the `rtps-interop` job above.
      - name: Live two-process shmem interop (rendezvous-file delivery + cross-process TransientLocal)
        run: cargo test --release --test shmem_two_process_interop -- --ignored --test-threads=1

  cyclone-interop:
    name: RTPS interop against a live CycloneDDS peer (ROADMAP.md "Interop testing", deliverable 3/3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Deliverable 3/3: a third, independent oracle beyond go-DDS
      # self-interop. Same probe-then-skip-cleanly posture as go-DDS's own
      # `test-interop` CI job: this job stays green (not red) when the
      # CycloneDDS image cannot be pulled, since a native, environment-
      # dependent image is not something ordinary CI runs should be
      # blocked on — see docker-compose.yml's note.
      - name: Probe CycloneDDS image availability
        id: probe
        run: |
          if docker pull eclipse-cyclonedds/cyclonedds:latest 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CycloneDDS Docker image not available — skipping live-peer interop tests (see docker-compose.yml)"
          fi
      - name: Start CycloneDDS peer
        if: steps.probe.outputs.available == 'true'
        run: docker compose up -d cyclone-peer
      - name: Live RTPS interop against CycloneDDS (SPDP + SEDP + reliable/best-effort samples)
        if: steps.probe.outputs.available == 'true'
        run: cargo test --release --features cyclone-interop --test cyclone_interop -- --ignored --test-threads=1
        env:
          CYCLONE_INTEROP_TIMEOUT_SECS: "15"
      - name: Stop CycloneDDS peer
        if: steps.probe.outputs.available == 'true'
        run: docker compose down

  rsfusa-check:
    name: rsFuSa safety check — exits 1 on ERROR (§20.1.2, REQ-ASIL/IEC/DO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rsfusa CLI
        run: |
          git clone --branch v0.3.14 --depth 1 https://github.com/SoundMatt/rust-FuSa /tmp/rsfusa-src
          cd /tmp/rsfusa-src && cargo build --release
          cp /tmp/rsfusa-src/target/release/rsfusa /tmp/rsfusa
      - name: Run safety check gate
        run: /tmp/rsfusa check

  rsfusa-qualify:
    name: rsFuSa tool qualification — 16/16 must pass (§20.1.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rsfusa CLI
        run: |
          git clone --branch v0.3.14 --depth 1 https://github.com/SoundMatt/rust-FuSa /tmp/rsfusa-src
          cd /tmp/rsfusa-src && cargo build --release
          cp /tmp/rsfusa-src/target/release/rsfusa /tmp/rsfusa
      - name: Run tool qualification suite
        run: /tmp/rsfusa qualify

  rsfusa-vuln:
    name: rsFuSa dependency vulnerability scan (§20.1.2, REQ-SEC-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rsfusa CLI
        run: |
          git clone --branch v0.3.14 --depth 1 https://github.com/SoundMatt/rust-FuSa /tmp/rsfusa-src
          cd /tmp/rsfusa-src && cargo build --release
          cp /tmp/rsfusa-src/target/release/rsfusa /tmp/rsfusa
      - name: Scan dependencies for vulnerabilities
        run: /tmp/rsfusa vuln

  rsfusa-cyber:
    name: rsFuSa cybersecurity analysis (§20.1.2, REQ-SEC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build rsfusa CLI
        run: |
          git clone --branch v0.3.14 --depth 1 https://github.com/SoundMatt/rust-FuSa /tmp/rsfusa-src
          cd /tmp/rsfusa-src && cargo build --release
          cp /tmp/rsfusa-src/target/release/rsfusa /tmp/rsfusa
      - name: Run cybersecurity analysis
        run: /tmp/rsfusa cyber

  fusa-trace:
    name: FuSa traceability 100% (§20.1.2, REQ-IEC-003/004, REQ-DO-001)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all requirements have fusa:req implementation annotations
        run: |
          MISSING_REQ=0
          while IFS= read -r req_id; do
            if ! grep -rq "//fusa:req ${req_id}" src/; then
              echo "ERROR: ${req_id} has no //fusa:req annotation in src/"
              MISSING_REQ=1
            fi
          done < <(python3 -c "
          import json, sys
          reqs = json.load(open('requirements.json'))['requirements']
          for r in reqs: print(r['id'])
          ")
          if [ "$MISSING_REQ" -ne 0 ]; then
            echo ""
            echo "All requirements must have at least one //fusa:req annotation."
            exit 1
          fi
          echo "All requirements have fusa:req annotations."
      - name: Check all requirements have fusa:test test annotations
        run: |
          MISSING_TEST=0
          while IFS= read -r req_id; do
            if ! grep -rq "//fusa:test ${req_id}" src/; then
              echo "ERROR: ${req_id} has no //fusa:test annotation in src/"
              MISSING_TEST=1
            fi
          done < <(python3 -c "
          import json, sys
          reqs = json.load(open('requirements.json'))['requirements']
          for r in reqs: print(r['id'])
          ")
          if [ "$MISSING_TEST" -ne 0 ]; then
            echo ""
            echo "All requirements must have at least one //fusa:test annotation."
            exit 1
          fi
          echo "All requirements have fusa:test annotations."
      - name: Check no orphan fusa tags reference unknown requirement IDs
        run: |
          ORPHAN=0
          KNOWN=$(python3 -c "
          import json
          reqs = json.load(open('requirements.json'))['requirements']
          for r in reqs: print(r['id'])
          ")
          while IFS= read -r tag; do
            req_id=$(echo "$tag" | grep -oP 'REQ-[A-Z]+-\d+')
            if ! echo "$KNOWN" | grep -qx "$req_id"; then
              echo "ERROR: orphan tag referencing unknown ID: $req_id"
              ORPHAN=1
            fi
          done < <(grep -rh "//fusa:" src/ | grep -oP 'REQ-[A-Z]+-\d+')
          if [ "$ORPHAN" -ne 0 ]; then
            exit 1
          fi
          echo "No orphan fusa tags found."

  safety-artifacts:
    name: safety artifacts and evidence (§20.4, REQ-DO-001, REQ-ASIL-009)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (+tags) required by the freshness checks below:
          # `git merge-base --is-ancestor` needs provenance.json's
          # vcsRevision commit object to actually be present locally, and
          # `git describe --tags` needs every tag, not just the default
          # shallow depth-1 checkout.
          fetch-depth: 0
      - name: Verify all required safety, security, and evidence documents exist
        run: |
          MISSING=0
          for f in \
            SECURITY.md SAFETY_PLAN.md SAFETY_CASE.md SAFETY_MANUAL.md BOUNDARY.md \
            requirements.json \
            .fusa.json .fusa-reqs.json .fusa-hara.json \
            fmea.json fmea.csv tara.json tara.md \
            sbom.json provenance.json artifact-manifest.json vuln.json; do
            if [ ! -f "$f" ]; then
              echo "ERROR: required artifact missing: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi
          echo "All safety artifacts and evidence documents present."
      - name: Verify requirements.json is valid JSON
        run: python3 -c "import json; json.load(open('requirements.json')); print('requirements.json is valid JSON')"
      - name: Verify .fusa.json is valid JSON
        run: python3 -c "import json; json.load(open('.fusa.json')); print('.fusa.json is valid JSON')"
      - name: Verify fmea.json is valid JSON
        run: python3 -c "import json; json.load(open('fmea.json')); print('fmea.json is valid JSON')"
      - name: Verify tara.json is valid JSON
        run: python3 -c "import json; json.load(open('tara.json')); print('tara.json is valid JSON')"
      - name: Verify sbom.json is valid JSON
        run: python3 -c "import json; json.load(open('sbom.json')); print('sbom.json is valid JSON')"
      - name: Verify .fusa-hara.json is valid JSON with required hazards
        run: |
          python3 -c "
          import json
          d = json.load(open('.fusa-hara.json'))
          hazards = d.get('hazards', [])
          assert len(hazards) >= 5, f'HARA must have at least 5 hazards, found {len(hazards)}'
          for h in hazards:
              assert 'hazardId' in h and 'asil' in h, f'Hazard missing required fields: {h}'
          print(f'.fusa-hara.json valid: {len(hazards)} hazards')
          "
      - name: Verify tara.json has DDS-specific threats
        run: |
          python3 -c "
          import json
          d = json.load(open('tara.json'))
          entries = d.get('entries', [])
          assert len(entries) >= 5, f'TARA must have at least 5 threats, found {len(entries)}'
          print(f'tara.json valid: {len(entries)} threats')
          "
      - name: Verify requirements.json has expected minimum count
        run: |
          python3 -c "
          import json
          d = json.load(open('requirements.json'))
          reqs = d.get('requirements', [])
          assert len(reqs) >= 100, f'Expected at least 100 requirements, found {len(reqs)}'
          print(f'requirements.json valid: {len(reqs)} requirements')
          "
      - name: Verify provenance.json is valid JSON
        run: python3 -c "import json; json.load(open('provenance.json')); print('provenance.json is valid JSON')"
      - name: Verify artifact-manifest.json is valid JSON
        run: python3 -c "import json; json.load(open('artifact-manifest.json')); print('artifact-manifest.json is valid JSON')"
      # Catches exactly the bug reported in #53: vuln.json can claim
      # `"clean": true` while `"scanned": 0` — a scan that covered zero
      # packages provides zero evidence of a clean dependency tree.
      - name: Verify vuln.json is valid JSON and reports a real (non-trivial) scan
        run: |
          python3 -c "
          import json
          d = json.load(open('vuln.json'))
          scanned = d.get('scanned', 0)
          assert scanned > 0, f'vuln.json reports scanned={scanned} — a scan covering zero packages cannot support a clean result'
          print(f'vuln.json valid: scanned {scanned} package(s), {d[\"summary\"][\"vulnerabilities\"]} finding(s)')
          "
      # §20.4 evidence freshness (#53): the checked-in provenance/SBOM/vuln/
      # manifest evidence is a point-in-time snapshot, not regenerated on
      # every commit, so it can silently drift arbitrarily far behind the
      # code it's meant to describe with no red CI signal — as happened
      # here, where the evidence predated 28+ releases' worth of changes.
      # Bound the drift instead of requiring exact per-commit sync (which
      # would be defeated by every squash-merge minting a new commit SHA
      # anyway): the evidence MUST be at least as fresh as the most
      # recently tagged release, i.e. every release MUST be preceded by
      # (or include) an evidence regeneration.
      - name: Verify §20.4 evidence is at least as fresh as the latest tagged release
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          LATEST_TAG_DATE=$(git log -1 --format=%cI "$LATEST_TAG")
          echo "Latest tagged release: $LATEST_TAG ($LATEST_TAG_DATE)"
          for f in provenance.json sbom.json vuln.json artifact-manifest.json; do
            python3 -c "
          import datetime, json, sys
          gen = json.load(open('$f'))['generatedAt']
          gen_dt = datetime.datetime.fromisoformat(gen.replace('Z', '+00:00'))
          latest_dt = datetime.datetime.fromisoformat('$LATEST_TAG_DATE')
          if gen_dt < latest_dt:
              print(f'ERROR: $f generatedAt ({gen_dt.isoformat()}) predates the latest tagged release $LATEST_TAG ({latest_dt.isoformat()}) — evidence is stale')
              sys.exit(1)
          print(f'$f generatedAt {gen_dt.isoformat()} is at least as fresh as $LATEST_TAG ({latest_dt.isoformat()})')
          "
          done
      # provenance.json's vcsRevision must be a real commit reachable from
      # HEAD, not an unrelated/orphaned/foreign hash (as happened here,
      # where it referenced a commit predating even this repo's first
      # tracked evidence commit).
      - name: Verify provenance.json vcsRevision is a real ancestor of HEAD
        run: |
          REV=$(python3 -c "import json; print(json.load(open('provenance.json'))['vcsRevision'])")
          if ! git merge-base --is-ancestor "$REV" HEAD 2>/dev/null; then
            echo "ERROR: provenance.json vcsRevision '$REV' is not a real ancestor of HEAD — evidence does not describe this repository's actual history"
            exit 1
          fi
          echo "provenance.json vcsRevision $REV is a real ancestor of HEAD"

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          MISSING=$(git log --format="%H %s" "$BASE".."$HEAD" | while read hash msg; do
            if ! git show "$hash" | grep -qiE "^    Signed-off-by:"; then
              echo "$hash $msg"
            fi
          done)
          if [ -n "$MISSING" ]; then
            echo "ERROR: The following commits are missing Signed-off-by:"
            echo "$MISSING"
            exit 1
          fi
          echo "All commits have Signed-off-by."
